[workspace]
resolver = "2"
members = ["crates/probe", "crates/ingest", "crates/stats", "crates/web"]

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
anyhow = "1"
askama = "0.16"
axum = "0.8"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
